# Edge-RAG Worker configuration (Wrangler)
# -----------------------------------------
# One Worker, three deployable topologies. Each `env` differs only in bindings/vars, so the
# probes compare configurations, not code:
#   npx wrangler deploy --env pooled     -> edge-pooled   (Hyperdrive -> central primary)
#   npx wrangler deploy --env replica    -> edge-replica  (Hyperdrive -> near-PoP read replica)
#   npx wrangler deploy --env unpooled   -> edge-unpooled (direct TCP+TLS to the primary per request)
#
# Secrets (never in this file):
#   npx wrangler secret put DATABASE_URL --env unpooled     # postgres://... (sslmode required)
# Hyperdrive configs:
#   npx wrangler hyperdrive create edge-rag-primary --connection-string="postgres://USER:PW@PRIMARY_HOST:5432/DB"
#   npx wrangler hyperdrive create edge-rag-replica --connection-string="postgres://USER:PW@REPLICA_HOST:5432/DB"
# and paste the ids below.

name = "edge-rag"
main = "worker.ts"
compatibility_date = "2025-07-01"
# nodejs_compat lets the `postgres` driver use the Node built-ins it expects.
compatibility_flags = ["nodejs_compat"]
# Keep the Worker at the PoP nearest the user. Smart Placement would move it towards the DB and
# defeat the experiment.
[placement]
mode = "off"

[ai]
binding = "AI"

[vars]
MAX_TOP_K = "50"
# HNSW candidate-list size applied per query inside a transaction (SET LOCAL). Table II of the
# paper: recall 0.90-0.97 at the pgvector default of 40, >=0.99 at 100-400 for 300k x 768.
EF_SEARCH = "100"
TOPOLOGY = "hyperdrive"
TOPOLOGY_LABEL = "edge-pooled"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<hyperdrive-id-primary>"

# ---------------------------------------------------------------- edge-pooled (explicit env)
[env.pooled]
name = "edge-rag-pooled"
[env.pooled.ai]
binding = "AI"
[env.pooled.vars]
MAX_TOP_K = "50"
EF_SEARCH = "100"
TOPOLOGY = "hyperdrive"
TOPOLOGY_LABEL = "edge-pooled"
[[env.pooled.hyperdrive]]
binding = "HYPERDRIVE"
id = "<hyperdrive-id-primary>"

# ---------------------------------------------------------------- edge-replica
[env.replica]
name = "edge-rag-replica"
[env.replica.ai]
binding = "AI"
[env.replica.vars]
MAX_TOP_K = "50"
EF_SEARCH = "100"
TOPOLOGY = "hyperdrive"
TOPOLOGY_LABEL = "edge-replica"
[[env.replica.hyperdrive]]
binding = "HYPERDRIVE"
id = "<hyperdrive-id-replica>"

# ---------------------------------------------------------------- edge-unpooled
[env.unpooled]
name = "edge-rag-unpooled"
[env.unpooled.ai]
binding = "AI"
[env.unpooled.vars]
MAX_TOP_K = "50"
EF_SEARCH = "100"
TOPOLOGY = "direct"
TOPOLOGY_LABEL = "edge-unpooled"
