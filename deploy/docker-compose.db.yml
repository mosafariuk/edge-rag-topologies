# Edge-RAG Phase 2: pgvector database for the central primary and the near-PoP replica copy.
# Same image family as the July 2026 benchmark (pgvector/pgvector:pg17). Tuned for an 8 GB VM.
# TLS is on (self-signed cert generated by deploy/db_up.sh); clients use sslmode=require.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: edge_rag_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgerag
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: edgerag
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    shm_size: "1gb"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/server.crt:/etc/pg/server.crt:ro
      - ./certs/server.key:/etc/pg/server.key:ro
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/pg/server.crt"
      - "-c"
      - "ssl_key_file=/etc/pg/server.key"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "jit=off"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgerag -d edgerag"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
